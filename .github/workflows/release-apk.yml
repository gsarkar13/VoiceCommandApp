name: Release APK

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Decode signing keystore
        run: echo "${{ secrets.PARTNER_KEYSTORE_BASE64 }}" | base64 -d > partner-release.jks

      - name: Build signed release APK
        env:
          PARTNER_KEYSTORE_FILE: ${{ github.workspace }}/partner-release.jks
          PARTNER_KEYSTORE_PASSWORD: ${{ secrets.PARTNER_KEYSTORE_PASSWORD }}
          PARTNER_KEY_ALIAS: ${{ secrets.PARTNER_KEY_ALIAS }}
          PARTNER_KEY_PASSWORD: ${{ secrets.PARTNER_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            app/build/outputs/apk/release/app-release.apk \
            --title "Partner $GITHUB_REF_NAME" \
            --generate-notes
